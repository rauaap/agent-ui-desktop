<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent UI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23100f12'/><circle cx='16' cy='16' r='7' fill='%23d97757'/></svg>">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-head">
        <span class="sidebar-title">Projects</span>
        <button class="icon-btn" id="refresh-btn" title="Reload projects and sessions">&#8635;</button>
        <button class="icon-btn" id="new-project-btn" title="New project">+</button>
      </div>
      <nav id="tree"></nav>
      <div
        class="sidebar-resizer"
        id="sidebar-resizer"
        role="separator"
        aria-label="Resize sidebar"
        aria-orientation="vertical"
        tabindex="0"
        title="Drag to resize the sidebar; double-click to reset"
      ></div>
    </aside>

    <main id="main">
      <button class="sidebar-toggle" id="sidebar-toggle" title="Toggle sidebar">&#9776;</button>
      <div id="panes">
        <div class="empty-state" id="empty-state">
          <div class="big">No session selected</div>
          <div>Pick a session from the sidebar, or create one.</div>
        </div>
      </div>
    </main>
  </div>

  <div id="toasts"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
