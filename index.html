<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent UI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23100f12'/><circle cx='16' cy='16' r='7' fill='%23d97757'/></svg>">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-head">
        <input type="search" id="sidebar-search" class="sidebar-search" placeholder="Search projects and sessions" aria-label="Search projects and sessions" aria-controls="tree" autocomplete="off">
        <button class="icon-btn usage-btn" id="usage-btn" title="Subscription usage">U</button>
        <button class="icon-btn" id="new-project-btn" title="New project">+</button>
      </div>
      <div class="session-age-control" title="Hide sessions inactive for more than this many days. Session-name search matches remain visible.">
        <input type="checkbox" id="session-age-enabled" role="switch" aria-label="Hide inactive sessions" aria-controls="tree" aria-describedby="session-age-help">
        <input type="range" id="session-age-slider" min="1" max="1" step="1" value="1" aria-label="Inactivity cutoff in days" aria-controls="tree" aria-describedby="session-age-help">
        <input type="number" id="session-age-days" min="1" max="1" step="1" value="1" aria-label="Inactivity cutoff in days" aria-controls="tree" aria-describedby="session-age-help">
        <span class="session-age-unit">days</span>
        <span id="session-age-help" class="visually-hidden">Hide sessions inactive for more than the selected number of days. Session-name search matches remain visible. Switch off to show all sessions.</span>
      </div>
      <nav id="tree"></nav>
      <div
        class="sidebar-resizer"
        id="sidebar-resizer"
        role="separator"
        aria-label="Resize sidebar"
        aria-orientation="vertical"
        tabindex="0"
        title="Drag to resize the sidebar; double-click to reset"
      ></div>
    </aside>

    <main id="main">
      <button class="sidebar-toggle" id="sidebar-toggle" title="Toggle sidebar">&#9776;</button>
      <div id="panes">
        <div class="empty-state" id="empty-state">
          <div class="big">No session selected</div>
          <div>Pick a session from the sidebar, or create one.</div>
        </div>
      </div>
    </main>
  </div>

  <div id="toasts"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
